<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Items for sale</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #f4f1ea;
    color: #222;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 24px; }
  #dropzone {
    border: 2px dashed #bbb;
    border-radius: 10px;
    padding: 32px;
    text-align: center;
    background: #fff;
    cursor: pointer;
    margin-bottom: 24px;
  }
  #dropzone.drag { border-color: #d97757; background: #fff7f2; }
  #dropzone input { display: none; }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 18px; margin: 0 0 4px; text-transform: capitalize; }
  .meta { color: #777; font-size: 13px; margin-bottom: 10px; }
  .images { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .images a img {
    width: 90px; height: 90px; object-fit: cover;
    border-radius: 6px; border: 1px solid #ddd; display: block;
  }
  .field-group { margin-bottom: 10px; }
  .field-group label { font-size: 12px; font-weight: 600; color: #555; display: block; margin-bottom: 2px; }
  textarea {
    width: 100%; box-sizing: border-box;
    font-family: inherit; font-size: 14px; padding: 8px;
    border-radius: 6px; border: 1px solid #ccc; resize: vertical;
  }
  textarea.field-sm { min-height: 32px; }
  textarea.field-lg { min-height: 70px; }
  .copy-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  button.copy {
    background: #d97757; color: #fff; border: none;
    padding: 8px 14px; border-radius: 6px; font-size: 14px;
    cursor: pointer;
  }
  button.copy.copied { background: #4a9c6d; }
  .imgnote { font-size: 12px; color: #888; margin-top: -6px; margin-bottom: 10px; }
  .images .img-thumb {
    cursor: pointer;
    width: 90px; height: 90px; object-fit: cover;
    border-radius: 6px; border: 1px solid #ddd; display: block;
  }
</style>
</head>
<body>

<h1>Items for sale</h1>
<p class="sub">Drop in your CSV. Each item becomes a ready-to-paste listing, with clickable photos.</p>

<div id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div id="dropzoneLabel">Click to choose your CSV, or drag it here</div>
  <input type="file" id="fileInput" accept=".csv">
</div>

<div id="results"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const results = document.getElementById('results');

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  document.getElementById('dropzoneLabel').textContent = 'Loaded: ' + file.name;
  const reader = new FileReader();
  reader.onload = function(e) {
    let text = e.target.result;
    // Strip leading rows that are empty or only commas (before the real header)
    const lines = text.split('\n');
    while (lines.length && /^[\s,]*$/.test(lines[0])) {
      lines.shift();
    }
    text = lines.join('\n');
    Papa.parse(text, {
      header: true,
      skipEmptyLines: true,
      complete: res => render(res.data)
    });
  };
  reader.readAsText(file);
}

function driveIdFromUrl(url) {
  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
  return match ? match[1] : null;
}

function driveThumbnail(id) {
  return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w200';
}

function render(rows) {
  results.innerHTML = '';
  rows.forEach((row, idx) => {
    const item = (row.Item || row.item || '').trim();
    const category = (row.Category || row.category || '').trim();
    const description = (row.Description || row.description || '').trim();
    const date = (row.Date || row.date || '').trim();
    const imagesRaw = row.Images || row.images || '';
    if (!item && !description) return;

    // Extract URLs from messy input — handles newlines, commas, spaces, or any mix as delimiters
    const links = (imagesRaw.match(/https?:\/\/[^\s,]+/g) || []).map(s => s.trim());

    const card = document.createElement('div');
    card.className = 'card';

    let imagesHtml = '';
    if (links.length) {
      imagesHtml += '<div class="images">';
      links.forEach(link => {
        const id = driveIdFromUrl(link);
        const imgSrc = id ? driveThumbnail(id) : link;
        imagesHtml += `<a href="${link}" target="_blank" title="Open in Google Drive">
          <img class="img-thumb" src="${imgSrc}" alt="${item} photo" loading="lazy">
        </a>`;
      });
      imagesHtml += '</div>';
      imagesHtml += '<div class="imgnote">Click a photo to open in Google Drive.</div>';
    }

    const itemText = item.charAt(0).toUpperCase() + item.slice(1);
    card.innerHTML = `
      <h2>${item || '(untitled item)'}</h2>
      <div class="meta">${date ? date + ' · ' : ''}${category}</div>
      ${imagesHtml}
      <div class="field-group">
        <label>Name</label>
        <textarea id="name-${idx}" class="field-sm" readonly>${itemText}</textarea>
      </div>
      <div class="field-group">
        <label>Category</label>
        <textarea id="cat-${idx}" class="field-sm" readonly>${category}</textarea>
      </div>
      <div class="field-group">
        <label>Description</label>
        <textarea id="desc-${idx}" class="field-lg" readonly>${description}</textarea>
      </div>
      <div class="copy-row">
        <button class="copy" onclick="copyField('name-${idx}', this)">Copy Name</button>
        <button class="copy" onclick="copyField('cat-${idx}', this)">Copy Category</button>
        <button class="copy" onclick="copyField('desc-${idx}', this)">Copy Description</button>
        <button class="copy" onclick="copyAll(${idx}, this)">Copy All</button>
      </div>
    `;
    results.appendChild(card);
  });

  if (!results.innerHTML) {
    results.innerHTML = '<p style="color:#888;">No rows found. Check that your CSV has Item, Category, Description, and Images columns.</p>';
  }
}

function copyField(id, btn) {
  const textarea = document.getElementById(id);
  const text = textarea.value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
  } else {
    textarea.select();
    document.execCommand('copy');
  }
  const original = btn.textContent;
  btn.textContent = 'Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
}

function copyAll(idx, btn) {
  const name = document.getElementById('name-' + idx).value;
  const cat = document.getElementById('cat-' + idx).value;
  const desc = document.getElementById('desc-' + idx).value;
  const text = name + '\nCategory: ' + cat + '\n' + desc;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).catch(() => {});
  }
  const original = btn.textContent;
  btn.textContent = 'Copied';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
}


</script>

</body>
</html>
